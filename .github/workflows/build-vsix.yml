name: Build VSIX

on:
  push:
    branches: [perf, perf-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python for embedded daemon syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check extension.js
      - name: Check embedded Python daemon syntax
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("extension.js","utf8"); const m=s.match(/const DAEMON_SCRIPT = `([\s\S]*?)`;/); if(!m)process.exit(1); fs.writeFileSync("/tmp/manim-preview-daemon.py", m[1]);'
          python -m py_compile /tmp/manim-preview-daemon.py
      - name: Test embedded cached-animation fast path
        run: python tests/test_daemon_perf.py /tmp/manim-preview-daemon.py
      - name: Validate and test selective slide-cache helper
        run: |
          python -m py_compile selective_slide.py
          python tests/test_selective_slide.py
          python - <<'PY'
          import pathlib
          daemon = pathlib.Path('/tmp/manim-preview-daemon.py').read_text()
          helper = pathlib.Path('selective_slide.py').read_text()
          combined = daemon.replace('# SELECTIVE_HELPER_PLACEHOLDER', helper)
          compile(combined, '<warm-daemon>', 'exec')
          assert 'class SlidePrefixCache' in combined
          PY
      - name: Test independently renderable sections
        run: |
          python -m py_compile independent_sections.py
          python tests/test_independent_sections.py
      - name: Remove checked-in legacy VSIX files
        run: rm -f -- ./*.vsix
      - name: Package extension
        run: npm run package
      - name: Verify packaged VSIX
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -name '*.vsix' | wc -l)" -eq 1
          vsix=$(find . -maxdepth 1 -name '*.vsix' -print -quit)
          test -n "$vsix"
          unzip -l "$vsix" | grep 'extension/extension.min.js'
          unzip -p "$vsix" extension/extension.min.js > /tmp/extension-bundle.js
          node --check /tmp/extension-bundle.js
          grep -F '[msp-perf]' /tmp/extension-bundle.js > /dev/null
          grep -F 'selective_slide.py' /tmp/extension-bundle.js > /dev/null
          unzip -l "$vsix" | grep 'extension/selective_slide.py'
          unzip -l "$vsix" | grep 'extension/independent_sections.py'
          unzip -p "$vsix" extension/package.json > /tmp/packaged-extension-package.json
          node -e 'const p=require("/tmp/packaged-extension-package.json"); if(p.version!=="1.9.0") process.exit(1)'
          grep -F 'perf-v2-independent-v1.9' /tmp/extension-bundle.js > /dev/null
          grep -F '[msp-build]' /tmp/extension-bundle.js > /dev/null
      - name: Stage only the verified VSIX
        run: |
          mkdir -p dist-vsix
          mv -- ./*.vsix dist-vsix/
          sha256sum dist-vsix/*.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: manim-slides-preview-v1.9.0-perf-v2
          path: dist-vsix/*.vsix
          if-no-files-found: error
          retention-days: 30
